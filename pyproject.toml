[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fatfish-video"
version = "0.1.0"
description = "FatFishLife 本地模板视频引擎"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
web = ["opencv-python-headless>=4.10"]

[project.scripts]
fatfish-video = "fatfish_video.cli:main"
fatfish-story = "fatfish_story.cli:main"
fatfish-bili = "fatfish_bili.cli:main"

[tool.setuptools.packages.find]
include = ["fatfish_video*", "fatfish_story*", "fatfish_bili*"]

[tool.setuptools.package-data]
fatfish_video = ["web/*.html", "web/*.css", "web/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]

